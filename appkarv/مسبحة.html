<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>مسبحة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        html, body { 
            height: 100%; 
            overflow: hidden; 
            -webkit-text-size-adjust: 100%;
        }
        body { 
            font-family: 'Cairo', sans-serif; 
            touch-action: manipulation;
            display: flex; 
            flex-direction: column; 
            background-color: #0f172a;
            color: #e2e8f0;
            /* *** NEW: Prevent text selection *** */
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
        }
        #screen-container { 
            flex-grow: 1; 
            overflow-y: auto; 
            position: relative; 
            -webkit-overflow-scrolling: touch;
        }
        nav { 
            flex-shrink: 0; 
            transition: transform 0.3s ease-in-out; 
            position: relative;
        }
        nav.nav-hidden { 
            transform: translateY(100%); 
        }
        .tap-highlight-transparent { 
            -webkit-tap-highlight-color: transparent; 
        }
        .active-nav-item { 
            color: #38bdf8;
        }
        .active-nav-item i { 
            transform: scale(1.1); 
        }
        .modal-backdrop { 
            background-color: rgba(0,0,0,0.7); 
            backdrop-filter: blur(4px);
        }
        .modal { 
            transition: transform 0.3s ease-out, opacity 0.3s ease-out; 
            transform: translateY(100%); 
            opacity: 0; 
        }
        .modal.is-open { 
            transform: translateY(0); 
            opacity: 1; 
        }
        .counter-btn-visual:active { 
            transform: scale(0.95); 
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.5); 
        }
        .toggle-checkbox {
            appearance: none; width: 3.5rem; height: 2rem; background-color: #4b5563;
            border-radius: 9999px; position: relative; cursor: pointer; transition: background-color 0.2s ease-in-out;
        }
        .toggle-checkbox::before {
            content: ''; position: absolute; width: 1.5rem; height: 1.5rem; background-color: white;
            border-radius: 9999px; top: 0.25rem; left: 0.25rem; transition: transform 0.2s ease-in-out;
        }
        .toggle-checkbox:checked { background-color: #38bdf8; }
        .toggle-checkbox:checked::before { transform: translateX(1.25rem); }
        
        .animation-overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: flex;
            flex-direction: column; align-items: center; justify-content: center;
            z-index: 100; pointer-events: none; opacity: 0;
        }
        #completion-overlay.visible {
            opacity: 1; transition: opacity 0.2s ease-in; background-color: rgba(220, 38, 38, 0.95); pointer-events: auto;
        }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
        #completion-overlay.visible .pulse-animation { animation: pulse 1.2s infinite; }
        @keyframes flash-blue {
            from { background-color: rgba(56, 189, 248, 0.7); transform: scale(0.8); opacity: 1; }
            to { background-color: transparent; transform: scale(1.2); opacity: 0; }
        }
        #transition-overlay.visible { animation: flash-blue 0.4s ease-out; }
        .active-tasbih-item {
            background-color: #1e293b !important; /* slate-800 */
            border-right: 4px solid #38bdf8; /* sky-500 */
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-200">

    <div id="screen-container">
        <main id="home-screen" class="flex flex-col h-full">
            <header class="w-full flex justify-between items-center h-16 px-4 flex-shrink-0 z-10">
                 <div class="w-16"></div>
                 <div class="flex-grow text-center overflow-hidden">
                    <h2 id="current-set-name" class="text-base md:text-lg font-bold text-sky-400 truncate"></h2>
                 </div>
                <div class="w-16 text-right">
                    <button id="reset-btn" class="w-12 h-12 flex items-center justify-center bg-slate-800 hover:bg-red-500/80 transition-all rounded-full text-white">
                        <i class="ph-bold ph-arrow-counter-clockwise text-2xl"></i>
                    </button>
                </div>
            </header>

            <div id="full-screen-counter-area" class="flex-grow flex flex-col items-center justify-center w-full cursor-pointer p-4">
                <p id="current-tasbih-text" class="text-3xl sm:text-4xl md:text-5xl font-bold text-center mb-4"></p>
                <div class="relative flex items-center justify-center my-4">
                    <div id="counter-btn-visual" class="transition-all duration-200 flex items-center justify-center w-52 h-52 md:w-64 md:h-64 bg-slate-800 rounded-full border-8 border-sky-500 shadow-lg">
                        <span id="main-counter" class="text-7xl font-bold">0</span>
                    </div>
                </div>
                 <div class="flex justify-center items-baseline space-x-2 space-x-reverse h-12">
                    <p class="text-lg text-slate-500">الهدف:</p>
                    <span id="target-counter" class="text-xl text-slate-400">0</span>
                </div>
            </div>
        </main>

        <main id="list-screen" class="p-4 hidden"></main>
        <main id="stats-screen" class="p-4 hidden"></main>
        <main id="settings-screen" class="p-4 hidden"></main>

        <div id="transition-overlay" class="animation-overlay"></div>
        <div id="completion-overlay" class="animation-overlay">
            <div class="text-center text-white p-4">
                <i class="ph-bold ph-check-circle text-8xl mb-4 pulse-animation"></i>
                <h2 class="text-4xl font-bold">أحسنت!</h2>
                <!-- *** NEW: Dynamic completion message *** -->
                <p id="completion-text" class="text-xl mb-8">لقد أتممت التسبيح</p>
                <div class="flex flex-col sm:flex-row gap-4 w-full max-w-xs mx-auto">
                    <button id="completion-continue-btn" class="w-full bg-sky-500 hover:bg-sky-600 text-white font-bold py-3 px-4 rounded-lg transition-colors">متابعة</button>
                    <button id="completion-change-btn" class="w-full bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 px-4 rounded-lg transition-colors">تغيير التسبيح</button>
                </div>
            </div>
        </div>
    </div>

    <div id="add-edit-modal" class="fixed inset-0 z-50 flex items-end justify-center modal-backdrop hidden"></div>
    <div id="confirm-modal" class="fixed inset-0 z-50 flex items-center justify-center modal-backdrop hidden p-4"></div>

    <nav id="bottom-nav" class="bg-slate-800 w-full shadow-lg border-t border-slate-700">
        <button id="nav-toggle-btn" class="absolute -top-6 right-1/2 translate-x-1/2 bg-slate-700 hover:bg-slate-600 w-12 h-6 rounded-t-lg flex items-center justify-center text-slate-400 transition">
            <i id="nav-toggle-icon" class="ph-bold ph-caret-down text-xl"></i>
        </button>
        <div class="max-w-md mx-auto px-4">
            <div class="flex justify-around">
                <button data-screen="home-screen" class="nav-item flex flex-col items-center text-center text-slate-400 hover:text-sky-400 transition-colors py-3 w-1/4">
                    <i class="ph-bold ph-house text-2xl"></i><span class="text-xs">الرئيسية</span>
                </button>
                <button data-screen="list-screen" class="nav-item flex flex-col items-center text-center text-slate-400 hover:text-sky-400 transition-colors py-3 w-1/4">
                    <i class="ph-bold ph-list-bullets text-2xl"></i><span class="text-xs">التسبيحات</span>
                </button>
                <button data-screen="stats-screen" class="nav-item flex flex-col items-center text-center text-slate-400 hover:text-sky-400 transition-colors py-3 w-1/4">
                    <i class="ph-bold ph-chart-bar text-2xl"></i><span class="text-xs">الإحصاءات</span>
                </button>
                <button data-screen="settings-screen" class="nav-item flex flex-col items-center text-center text-slate-400 hover:text-sky-400 transition-colors py-3 w-1/4">
                    <i class="ph-bold ph-gear text-2xl"></i><span class="text-xs">الإعدادات</span>
                </button>
            </div>
        </div>
    </nav>

        function navigateTo(screenId, fromBackButton = false) {

                        });
                        existingIds.forEach(id => { if (!updatedIds.has(id)) state.tasbihs = state.tasbihs.filter(t => t.id !== id); });
                        item.order = newOrder;
                    }
                } else {
                    if (currentType === 'single') { const name = form.querySelector('#tasbih-name').value; const target = parseInt(form.querySelector('#tasbih-target').value) || null; state.tasbihs.push({ id: `t_${Date.now()}`, type: 'single', name, target, totalCount: 0, dailyCounts: {} }); } 
                    else if (currentType === 'group') {
                        const groupId = `g_${Date.now()}`; const groupName = form.querySelector('#group-name').value; const groupOrder = [];
                        form.querySelectorAll('#group-steps > div').forEach(el => {
                            const id = `t_${Date.now()}_${groupOrder.length}`; const name = el.querySelector('.step-name').value; const target = parseInt(el.querySelector('.step-target').value);
                            if (name && target) { state.tasbihs.push({ id, type: 'group-item', name, target, groupId, totalCount: 0, dailyCounts: {} }); groupOrder.push(id); }
                        });
                        if (groupName && groupOrder.length > 0) state.groups.push({ id: groupId, name: groupName, order: groupOrder });
                    }
                }
                saveState(); updateAllUI(); if (history.state?.modal) history.back(); else closeModal(addEditModalEl);
            });
            addEditModalEl.querySelector('#close-modal-btn').addEventListener('click', () => { if (history.state?.modal) history.back(); else closeModal(addEditModalEl); });
            openModal(addEditModalEl, 'add-edit');
        }

        function openConfirmModal({ action, type, id }) {
            const config = {
                'delete_tasbeeh': { title: 'حذف التسبيح', msg: 'هل أنت متأكد من حذف هذا التسبيح؟', confirmAction: () => deleteTasbeeh(id) },
                'delete_group': { title: 'حذف المجموعة', msg: 'هل أنت متأكد من حذف هذه المجموعة وكل التسبيحات بداخلها؟', confirmAction: () => deleteGroup(id) },
                'delete_all': { title: 'حذف كل البيانات', msg: 'تحذير! سيتم حذف جميع التسبيحات والإحصاءات بشكل نهائي.', confirmAction: deleteEverything },
                'reset_counter': { title: 'إعادة العد', msg: 'هل أنت متأكد من إعادة العداد الحالي إلى الصفر؟', confirmAction: () => { recordAndResetSession(); updateHomeScreenUI(); vibrate(100); } }
            };
            const key = `${action}_${type}`;
            const currentConfig = config[key]; if (!currentConfig) return;
            confirmModalEl.innerHTML = `<div class="bg-slate-800 rounded-lg shadow-lg p-6 w-11/12 max-w-sm text-center"><h3 class="text-lg font-bold mb-4">${currentConfig.title}</h3><p class="text-slate-300 mb-6">${currentConfig.msg}</p><div class="flex justify-between gap-4"><button id="confirm-btn" class="w-full text-white bg-red-600 hover:bg-red-700 font-medium rounded-lg text-sm px-5 py-2.5">تأكيد</button><button id="cancel-btn" class="w-full text-slate-300 bg-slate-600 hover:bg-slate-500 font-medium rounded-lg text-sm px-5 py-2.5">إلغاء</button></div></div>`;
            confirmModalEl.querySelector('#confirm-btn').onclick = () => { currentConfig.confirmAction(); if (history.state?.modal) history.back(); else closeModal(confirmModalEl); };
            confirmModalEl.querySelector('#cancel-btn').addEventListener('click', () => { if (history.state?.modal) history.back(); else closeModal(confirmModalEl); });
            openModal(confirmModalEl, 'confirm');
        }

        function deleteTasbeeh(id) { state.tasbihs = state.tasbihs.filter(t => t.id !== id); if (state.currentSession.tasbeehId === id) { recordAndResetSession(); state.currentSession.tasbeehId = state.tasbihs[0]?.id || null; } saveState(); updateAllUI(); }
        function deleteGroup(id) { const group = state.groups.find(g => g.id === id); if (!group) return; const isCurrentInGroup = group.order.includes(state.currentSession.tasbeehId); state.tasbihs = state.tasbihs.filter(t => t.groupId !== id); state.groups = state.groups.filter(g => g.id !== id); if (isCurrentInGroup) { recordAndResetSession(); state.currentSession.tasbeehId = state.tasbihs.find(t => t.type === 'single')?.id || state.groups[0]?.order[0] || null; } saveState(); updateAllUI(); }
        function deleteEverything() { localStorage.removeItem(DB_KEY); loadState(); buildAndRenderAll(); navigateTo('list-screen'); }

        window.addEventListener('popstate', (event) => {
            if (state.modalOpen) {
                const modalToClose = state.modalOpen === 'add-edit' ? addEditModalEl : confirmModalEl;
                closeModal(modalToClose);
            } else if (state.historyStack.length > 1) {
                state.historyStack.pop();
                const lastScreen = state.historyStack[state.historyStack.length - 1];
                navigateTo(lastScreen, true);
            }
        });

        loadState();
        buildAndRenderAll();
        navigateTo('home-screen');
        history.replaceState({ screen: 'home-screen' }, ''); // Set initial history state
    });
    </script>
</body>
</html>
