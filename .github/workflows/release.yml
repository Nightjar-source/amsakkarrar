name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Release Signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Restore Signing Credentials
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p composeApp
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > composeApp/Nightjar.keystore
          elif [ -f "keystore_base64.txt" ]; then
            cat keystore_base64.txt | base64 -d > composeApp/Nightjar.keystore
          fi
          echo "KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD:-19941994}" >> local.properties
          echo "KEY_PASSWORD=${KEY_PASSWORD:-19941994}" >> local.properties

      - name: Build Official Release APK
        run: ./gradlew :composeApp:assembleRelease --no-daemon --stacktrace

      - name: Locate APK
        id: find_apk
        run: |
          APK_PATH=$(find composeApp/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"
          NAMED_APK="composeApp/build/outputs/apk/release/amsakkarrar-release.apk"
          if [ -n "$APK_PATH" ]; then
            cp "$APK_PATH" "$NAMED_APK"
          fi
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "named_apk=$NAMED_APK" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: amsakkarrar-signed-apk
          path: |
            ${{ steps.find_apk.outputs.apk_path }}
            ${{ steps.find_apk.outputs.named_apk }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: |
            ${{ steps.find_apk.outputs.apk_path }}
            ${{ steps.find_apk.outputs.named_apk }}
          name: إمساكية كرار 2026 - النسخة المعتمدة ${{ github.ref_name }}
          body: |
            # 🌙 إمساكية كرار 2026 - النسخة العراقية الخالصة المتكيفة
            ### الإصدار المعتمد: ${{ github.ref_name }}

            تطبيق فلكي إسلامي شامل مبني بأحدث معايير كوتلن كامبوس (Compose Multiplatform 2026) متوافق 100% مع تقويم العتبة العباسية المقدسة وخوارزميات معهد الكفيل.
            
            - 🧭 حساب مواقيت الصلاة أوفلاين بدقة متناهية.
            - 🌌 قبة سماوية ثلاثية الأبعاد تفاعلية تتغير تدرجاتها مع دوران الأرض والشمس.
            - 📿 مكتبة مفاتيح الجنان للأدعية والزيارات الشيعية مع قارئ صوتي متطور.
            - 🕋 بوصلة القبلة الدقيقة مع حساب المسافة للكعبة المشرفة وطور القمر الفلكي.
            - 📱 دعم الشاشات المتكيفة (الهواتف واللوحيات) وفق إرشادات Material 3 الرسمية.
