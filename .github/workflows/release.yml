name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Release Signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Restore Signing Credentials
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p androidApp
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > androidApp/Nightjar.keystore
          elif [ -f "keystore_base64.txt" ]; then
            cat keystore_base64.txt | base64 -d > androidApp/Nightjar.keystore
          fi
          echo "KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD:-19941994}" >> local.properties
          echo "KEY_PASSWORD=${KEY_PASSWORD:-19941994}" >> local.properties

      - name: Build Official Release APK
        run: ./gradlew :androidApp:assembleRelease --no-daemon --stacktrace

      - name: Locate APK
        id: find_apk
        run: |
          APK_PATH=$(find androidApp/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"
          NAMED_APK="androidApp/build/outputs/apk/release/amsakkarrar-release.apk"
          if [ -n "$APK_PATH" ]; then
            cp "$APK_PATH" "$NAMED_APK"
          fi
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "named_apk=$NAMED_APK" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: amsakkarrar-signed-apk
          path: |
            ${{ steps.find_apk.outputs.apk_path }}
            ${{ steps.find_apk.outputs.named_apk }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: |
            ${{ steps.find_apk.outputs.apk_path }}
            ${{ steps.find_apk.outputs.named_apk }}
          name: إمساكية كرار 2026 - النسخة الشاملة بكامل الشاشات ${{ github.ref_name }}
          body: |
            # 🌙 إمساكية كرار 2026 - النسخة المعتمدة المتكاملة المنقولة بالكامل من تطبيق React
            ### الإصدار: ${{ github.ref_name }}

            - 🚀 مبني بأحدث معايير كوتلن كامبوس 2026 (Compose Multiplatform & Kotlin 2.4.20).
            - 🧭 محرك ملاحة Navigation 3 الأصلي بكامل كفاءته عبر المنصات (User-Owned Back Stack).
            - 📱 ودجيت الشاشة الرئيسية الحية للأندرويد عبر Jetpack Glance.
            - 🌅 **الشاشة 1 (اليوم):** القوس السماوي التفاعلي ثلاثي الأبعاد 3D Sky Arc، كشيدة الشهر المتصلة الفاخرة، والبطاقات التسع للمواقيت مع العداد التنازلي.
            - 🔭 **الشاشة 2 (القبلة والأهلة):** مرصد الكفيل 3D والقبة الفلكية وحسابات كبلر وميل الشمس ومعادلة الوقت، بوصلة القبلة الحية، وطور القمر الفلكي مع زاوية الإضاءة.
            - 📅 **الشاشة 3 (التقويم والإمساكية):** جدول إمساكية شهر رمضان المبارك الكامل (30 يوماً هجري وميلادي) مع ساعات الصيام بدقة فلكية.
            - 📿 **الشاشة 4 (الأدعية والزيارات):** مكتبة كاملة للأدعية والزيارات الشيعية المأثورة (الفرج، الحجة، كميل، الصباح، العهد، أمين الله، تعقيبات الصلاة) مع قارئ تفاعلي ومشغل صوت وتحكم بحجم الخط.
            - 📿 **الشاشة 5 (مسبحة الزهراء):** مسبحة تفاعلية بـ 3 مراحل (34 الله أكبر، 33 الحمد لله، 33 سبحان الله) مع مؤشرات دائرية ورسوم متحركة سلسة وإعادة ضبط.
            - 📊 **الشاشة 6 (مصفوفة الزوايا):** مصفوفة الزوايا وطرق الحساب الـ 13 الفلكية المعتمدة عالمياً مع التبديل الفوري بنقرة واحدة.
            - 📖 **الشاشة 7 (فقه المواقيت):** أبحاث ومقارنات فقهية وفلكية متعمقة (منتصف الليل الشرعي الشيعي، زاوية الشفق والمغرب، فتاوى السيستاني والصائغ، وقواعد العروض العليا والقطبية).
